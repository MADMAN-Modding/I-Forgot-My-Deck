[package]
name = "ifmd-back"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1.40.0", features = ["rt-multi-thread"] }
tokio-rustls = "0.26"
tower-service = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["json"] }
anyhow = "1.0.101"
tower = "0.5.3"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
futures = "0.3.32"
tower-http = { version="0.6.6", features=["cors"]}
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
directories = "6.0.0"
once_cell = "1.21.3"
oneshot = {version = "0.1.13", features = ["async"] }
tsync = "3.0.0"
lettre = "0.11.19"
email-address-parser = "2.0.0"
rand = "0.10.0"
sha256 = "1.6.0"
chrono = "0.4.43"
rustls = "0.23.36"
